buildscript {
    ext {
        springBootVersion = '3.5.11'
        springCloudVersion = '2025.0.1'
    }

    repositories {
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven {
            url "https://repo.ustra.io/repository/maven-public/"
        }
    }

    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
        classpath('io.spring.gradle:dependency-management-plugin:1.0.9.RELEASE')
        classpath("io.franzbecker:gradle-lombok:1.8")
    }
}

configurations.all {
    resolutionStrategy {
//        force "org.glassfish.jaxb:jaxb-runtime:4.0.6"
//        force "org.glassfish.jaxb:jaxb-core:4.0.6"

    }
}

allprojects {
    group = 'io.ustra.demo'
}

subprojects {
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'java'


    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    ext {
        ustraVersion = '3.5.0-SNAPSHOT'
    }


    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    repositories {
      	mavenCentral()
	    maven { url "https://repo.ustra.io/repository/maven-public/" }
    }

    dependencies {
        implementation 'ch.qos.logback:logback-core:1.5.18'
        implementation 'ch.qos.logback:logback-classic:1.5.18'

		implementation 'org.apache.logging.log4j:log4j-to-slf4j:2.17.1'
		implementation 'org.apache.logging.log4j:log4j-api:2.17.1'

        implementation 'org.springframework.boot:spring-boot-starter'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

      	compileOnly 'org.projectlombok:lombok'
        implementation 'org.springframework.boot:spring-boot-starter-aop'

        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
        annotationProcessor 'org.projectlombok:lombok:1.18.20'

        testAnnotationProcessor 'org.projectlombok:lombok:1.18.20'
        testCompileOnly 'org.projectlombok:lombok:1.18.20'

        implementation 'org.postgresql:postgresql:42.7.2'

    }
}
